name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the app checkout so Prettier/ESLint don't scan conduit-app
      - name: Check code quality
        run: npm run check

      - name: Checkout Conduit app
        uses: actions/checkout@v7
        with:
          repository: Henkich/conduit-app
          path: conduit-app

      # Throwaway CI database, so the example secrets are fine here
      - name: Start Conduit
        working-directory: conduit-app
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show app logs on failure
        if: failure()
        working-directory: conduit-app
        run: docker compose logs
